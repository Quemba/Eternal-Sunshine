<!DOCTYPE html>
<html lang="es">
<body>

<div th:fragment="alertas">

    <link rel="stylesheet" href="/css/tabler/tabler-icons.min.css">
    <link rel="stylesheet" href="/css/ui.css">

    <div th:if="${mensaje}" class="alerta alerta-ok" role="status">
        <span class="alerta-icono"><i class="ti ti-circle-check" aria-hidden="true"></i></span>
        <span class="alerta-texto" th:text="${mensaje}"></span>
        <button type="button" class="alerta-cerrar" aria-label="Cerrar aviso"><i class="ti ti-x" aria-hidden="true"></i></button>
    </div>

    <div th:if="${error}" class="alerta alerta-error" role="alert">
        <span class="alerta-icono"><i class="ti ti-alert-triangle" aria-hidden="true"></i></span>
        <span class="alerta-texto" th:text="${error}"></span>
        <button type="button" class="alerta-cerrar" aria-label="Cerrar aviso"><i class="ti ti-x" aria-hidden="true"></i></button>
    </div>

    <script src="/js/ui.js"></script>

</div>

</body>
</html>
