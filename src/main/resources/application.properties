spring.application.name=eternalsunshine-web

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/inventario_db}
spring.datasource.username=${DATABASE_USERNAME:inventario_user}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}

app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}

server.forward-headers-strategy=native

server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
app.admin.tienda=${ADMIN_TIENDA:Tienda principal}
app.registro.habilitado=${REGISTRO_HABILITADO:true}
app.registro.max-tiendas=${MAX_TIENDAS:200}

app.url=${APP_URL:}
app.correo.brevo-api-key=${BREVO_API_KEY:}
app.correo.remitente=${MAIL_FROM:}
app.correo.nombre=${MAIL_FROM_NAME:Eternal Sunshine}

server.port=${PORT:8080}
