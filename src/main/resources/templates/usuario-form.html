<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuario - Eternal Sunshine</title>

    <link rel="stylesheet"
          href="/css/dashboard.css">

    <link rel="stylesheet"
          href="/css/alertas.css">

    <style>

        .form-card{

            background:white;

            padding:30px;

            border-radius:20px;

            box-shadow:0 4px 12px rgba(0,0,0,.15);

            max-width:700px;

            margin:auto;
        }

        .form-group{

            margin-bottom:20px;
        }

        .form-group label{

            display:block;

            margin-bottom:8px;

            font-weight:bold;

            color:#4a1020;
        }

        .form-group input, .form-group select{

            width:100%;

            padding:12px;

            border:2px solid #c29be7;

            border-radius:10px;

            background:white;

            font-family:inherit;

            font-size:inherit;
        }

        .btn-guardar{

            background:#df6794;

            color:white;

            border:none;

            padding:14px 24px;

            border-radius:10px;

            cursor:pointer;

            font-weight:bold;
        }

        .btn-volver{

            background:#c29be7;

            color:white;

            text-decoration:none;

            padding:14px 24px;

            border-radius:10px;

            margin-left:10px;
        }

    </style>

</head>
<body>

<div class="dashboard">

    <div class="sidebar">

        <div class="logo-container">

            <img src="/images/logo.png"
                 class="logo">

            <h2>Eternal Sunshine</h2>

        </div>

    </div>

    <div class="content">

        <div class="header">

            <h1>Gestión de Usuarios</h1>

        </div>

        <div class="form-card">

            <form action="/usuarios/guardar"
                  method="post">

                <input type="hidden"
                       name="id"
                       th:value="${usuario.id}">

                <div th:replace="~{fragments/alertas :: alertas}"></div>

                <div class="form-group">
                    <label>Usuario</label>
                    <input type="text"
                           name="username"
                           th:value="${usuario.username}"
                           maxlength="50"
                           required>
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password"
                           name="password"
                           placeholder="Dejar en blanco para no cambiar la contraseña actual">
                    <small style="color:#666;">Si la cambias: mínimo 8 caracteres, con mayúscula, minúscula y número.</small>
                </div>

                <div class="form-group">
                    <label>Rol</label>
                    <select name="rol" required>
                        <option value="">-- Selecciona un rol --</option>
                        <option value="ADMIN" th:selected="${usuario.rol != null and usuario.rol.name() == 'ADMIN'}">Administrador</option>
                        <option value="EMPLEADO" th:selected="${usuario.rol != null and usuario.rol.name() == 'EMPLEADO'}">Empleado</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Tienda</label>
                    <input type="text"
                           name="tienda"
                           th:value="${usuario.tienda}"
                           maxlength="100">
                </div>

                <button type="submit"
                        class="btn-guardar">
                    Guardar Usuario
                </button>

                <a href="/usuarios"
                   class="btn-volver">
                    Volver
                </a>

            </form>

        </div>

    </div>

</div>

<script src="/js/alertas.js"></script>

</body>
</html>
