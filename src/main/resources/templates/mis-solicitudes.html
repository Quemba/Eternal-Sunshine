<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Solicitudes - Eternal Sunshine</title>

    <link rel="stylesheet"
          href="/css/dashboard.css">

    <style>
        .nuevo-tag { margin-left:8px; padding:3px 10px; border-radius:12px; background:#2e9d57; color:white; font-size:12px; font-weight:bold; }
    </style>
</head>
<body>

<div class="dashboard">

    <div class="sidebar">

        <div class="logo-container">

            <img src="/images/logo.png"
                 class="logo">

            <h2>Eternal Sunshine</h2>

        </div>

        <div th:replace="~{fragments/menu :: menu}"></div>

    </div>

    <div class="content">

        <div class="header">

            <h1>Mis Solicitudes</h1>

        </div>

        <div class="tabla">

            <p th:if="${#lists.isEmpty(solicitudes)}"
               style="text-align:center; color:#888; padding:20px;">
                Todavía no has hecho ninguna solicitud.
            </p>

            <table style="width:100%; border-collapse: collapse;">

                <thead>

                <tr style="background:#df6794; color:white;">

                    <th style="padding:10px;">Acción</th>

                    <th style="padding:10px;">Código</th>

                    <th style="padding:10px;">Nombre</th>

                    <th style="padding:10px;">Precio</th>

                    <th style="padding:10px;">Cantidad</th>

                    <th style="padding:10px;">Fecha</th>

                    <th style="padding:10px;">Estado</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="s : ${solicitudes}">

                    <td style="padding:10px;" th:text="${s.accion.name() == 'CREAR_PRODUCTO'} ? 'Crear' : 'Editar'"></td>

                    <td style="padding:10px;" th:text="${s.codigo}"></td>

                    <td style="padding:10px;" th:text="${s.nombre}"></td>

                    <td style="padding:10px;" th:text="'$ ' + ${#numbers.formatInteger(s.precio, 1, 'POINT')}"></td>

                    <td style="padding:10px;" th:text="${s.cantidad}"></td>

                    <td style="padding:10px;"
                        th:text="${#temporals.format(s.fechaSolicitud, 'dd/MM/yyyy HH:mm')}"></td>

                    <td style="padding:10px;">
                        <span th:if="${s.estado.name() == 'PENDIENTE'}" style="color:#a97a00;">Pendiente</span>
                        <span th:if="${s.estado.name() == 'APROBADA'}" style="color:#060;">Aprobada</span>
                        <span th:if="${s.estado.name() == 'RECHAZADA'}" style="color:#900;">Rechazada</span>
                        <span th:if="${nuevasIds != null and nuevasIds.contains(s.id)}" class="nuevo-tag">Nuevo</span>
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
