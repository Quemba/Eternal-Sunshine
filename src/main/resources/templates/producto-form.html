<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="${producto.id == null} ? 'Nuevo Producto - Eternal Sunshine' : 'Editar Producto - Eternal Sunshine'"></title>

    <link rel="stylesheet"
          href="/css/dashboard.css">

    <link rel="stylesheet"
          href="/css/tabler/tabler-icons.min.css">

    <link rel="stylesheet"
          href="/css/escaner.css">

    <link rel="stylesheet"
          href="/css/alertas.css">

    <style>

        [hidden]{

            display:none !important;
        }

        .form-card{

            background:white;

            padding:30px;

            border-radius:20px;

            box-shadow:0 4px 12px rgba(0,0,0,.15);

            max-width:700px;

            margin:auto;
        }

        .form-group{

            margin-bottom:20px;
        }

        .form-group label{

            display:block;

            margin-bottom:8px;

            font-weight:bold;

            color:#4a1020;
        }

        .form-group input,
        .form-group select{

            width:100%;

            padding:12px;

            border:2px solid #c29be7;

            border-radius:10px;

            font-family:inherit;

            font-size:16px;

            background:white;

            box-sizing:border-box;
        }

        .fila-codigo{

            display:flex;

            gap:10px;
        }

        .fila-codigo input{

            flex:1;

            min-width:0;

            width:auto;
        }

        .btn-escanear{

            background:#c29be7;

            color:white;

            border:none;

            padding:12px 18px;

            border-radius:10px;

            cursor:pointer;

            font-weight:bold;

            font-family:inherit;

            white-space:nowrap;
        }

        .btn-escanear i{

            font-size:19px;

            margin-right:4px;

            vertical-align:-3px;
        }

        .btn-escanear:disabled{

            background:#ccc;

            cursor:not-allowed;
        }

        .codigo-leido{

            margin:8px 0 0;

            font-size:13px;

            color:#060;
        }

        .codigo-error{

            color:#900;
        }

        .pista{

            display:block;

            margin-top:6px;

            color:#777;

            font-size:13px;

            line-height:1.4;
        }

        .pista a{

            color:#df6794;

            font-weight:bold;

            text-decoration:none;
        }

        .pista a:hover{

            text-decoration:underline;
        }

        #categoria-otra-caja{

            margin-top:10px;
        }

        .pista-categoria{

            display:inline-flex;

            align-items:center;

            gap:8px;

            margin:10px 0 0;

            padding:8px 12px;

            border:1px solid #f3cfdc;

            border-radius:10px;

            background:#fdf0f4;

            color:#4a1020;

            font-size:13px;

            font-weight:600;

            line-height:1.4;

            animation:pista-aparece .25s ease;
        }

        .pista-categoria i{

            flex-shrink:0;

            font-size:16px;

            color:#df6794;
        }

        @keyframes pista-aparece{

            from{

                opacity:0;

                transform:translateY(-4px);
            }

            to{

                opacity:1;

                transform:none;
            }
        }

        @media (prefers-reduced-motion: reduce){

            .pista-categoria{

                animation:none;
            }
        }

        .btn-guardar{

            background:#df6794;

            color:white;

            border:none;

            padding:14px 24px;

            border-radius:10px;

            cursor:pointer;

            font-weight:bold;

            font-family:inherit;
        }

        .btn-volver{

            background:#c29be7;

            color:white;

            text-decoration:none;

            padding:14px 24px;

            border-radius:10px;

            margin-left:10px;
        }

    </style>

</head>
<body>

<div class="dashboard">

    <div class="sidebar">

        <div class="logo-container">

            <img src="/images/logo.png"
                 class="logo">

            <h2>Eternal Sunshine</h2>

        </div>

    </div>

    <div class="content">

        <div class="header">

            <h1 th:text="${producto.id == null} ? 'Registrar Producto' : 'Editar Producto'"></h1>

        </div>

        <div class="form-card">

            <form action="/productos/guardar"
                    method="post"
                    autocomplete="off">

        <input type="hidden"
           name="id"
           th:value="${producto.id}">

        <div th:replace="~{fragments/alertas :: alertas}"></div>

                <div class="form-group">

                    <label>Código</label>

                    <div class="fila-codigo">

                        <input type="text"
                               id="campo-codigo"
                               name="codigo"
                               th:value="${producto.codigo}"
                               maxlength="50"
                               autocomplete="off"
                               required>

                        <button type="button"
                                id="btn-escanear"
                                class="btn-escanear">

                            <i class="ti ti-scan" aria-hidden="true"></i> Escanear

                        </button>

                    </div>

                    <p id="codigo-leido" class="codigo-leido"></p>

                    <div id="escaner-montaje" style="display:none;"></div>

                </div>

                <div class="form-group">

                    <label>Nombre</label>

                    <input type="text"
                             name="nombre"
                            th:value="${producto.nombre}"
                            maxlength="150"
                            autocomplete="off"
                            required>

                </div>

                <div class="form-group">

                    <label for="categoria-sel">Categoría</label>

                    <select id="categoria-sel"
                            name="categoria"
                            required>

                        <option value="" disabled selected>Selecciona una categoría...</option>

                        <option th:each="c : ${categorias}"
                                th:value="${c}"
                                th:text="${c}"></option>

                        <option value="__otro__">Otra categoría…</option>

                    </select>

                    <div id="categoria-otra-caja" hidden>

                        <input type="text"
                               id="categoria-otra"
                               name="categoriaOtra"
                               maxlength="100"
                               autocomplete="off"
                               placeholder="Nombre de la nueva categoría">

                    </div>

                    <p id="categoria-pista" class="pista-categoria" hidden></p>

                </div>

                <div class="form-group">

                    <label>Precio (COP)</label>

                    <input type="number"
                           step="1"
                           min="1"
                           name="precio"
                           th:value="${producto.precio}"
                           required>

                </div>

                <div class="form-group">

                    <label>Cantidad</label>

                    <input type="number"
                            min="0"
                            name="cantidad"
                            th:value="${producto.cantidad}"
                            required>

                    <small class="pista" th:if="${producto.id != null}">
                        ¿Llegó mercancía? Usa
                        <a href="/entradas/nueva"><i class="ti ti-package-import" aria-hidden="true"></i> Recibir mercancía</a>
                        para sumarla al inventario. Cambia esta cantidad solo para corregir un error.
                    </small>

                </div>

                <button type="submit"
                        class="btn-guardar">

                    Guardar Producto

                </button>

                <a href="/productos"
                   class="btn-volver">

                    Volver

                </a>

            </form>

        </div>

    </div>

</div>

<script src="/js/quagga.min.js"></script>
<script src="/js/escaner.js"></script>
<script src="/js/alertas.js"></script>

<script>
    (function () {
        var campoCodigo = document.getElementById('campo-codigo');
        var campoNombre = document.querySelector('input[name="nombre"]');
        var botonEscanear = document.getElementById('btn-escanear');
        var mensaje = document.getElementById('codigo-leido');

        function ponerBoton(boton, clase, texto) {
            boton.textContent = '';

            var glifo = document.createElement('i');
            glifo.className = 'ti ' + clase;
            glifo.setAttribute('aria-hidden', 'true');

            boton.appendChild(glifo);
            boton.appendChild(document.createTextNode(' ' + texto));
        }

        var escaner = EscanerCodigo.crear({
            montaje: document.getElementById('escaner-montaje'),
            confirmarDosVeces: true,
            alIniciar: function () {
                botonEscanear.disabled = true;
                ponerBoton(botonEscanear, 'ti-camera', 'Abriendo cámara...');
            },
            alActivar: function () {
                ponerBoton(botonEscanear, 'ti-camera', 'Cámara activa');
            },
            alCerrar: function () {
                botonEscanear.disabled = false;
                ponerBoton(botonEscanear, 'ti-scan', 'Escanear');
            },
            alError: function (texto) {
                mensaje.textContent = texto;
                mensaje.className = 'codigo-leido codigo-error';
            },
            alPrimeraLectura: function (codigo) {
                EscanerCodigo.pitidoAviso();
                mensaje.textContent = 'Primera lectura: ' + codigo + '. Apártalo un momento y vuélvelo a mostrar para confirmar.';
                mensaje.className = 'codigo-leido';
            },
            alLeer: function (codigo) {
                campoCodigo.value = codigo;
                mensaje.textContent = 'Código confirmado: ' + codigo + '. Compáralo con los números impresos en el empaque antes de guardar.';
                mensaje.className = 'codigo-leido';
                EscanerCodigo.pitido();
                escaner.cerrar();
                if (campoNombre) {
                    campoNombre.focus();
                }
                return true;
            }
        });

        botonEscanear.addEventListener('click', function () {
            escaner.abrir();
        });

        campoCodigo.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (campoNombre) {
                    campoNombre.focus();
                }
            }
        });

        window.addEventListener('pagehide', function () {
            escaner.cerrar();
        });
    })();
</script>

<script th:inline="javascript">
    (function () {
        var categoriaActual = /*[[${producto.categoria}]]*/ '';
        var esNuevo = /*[[${producto.id == null}]]*/ true;
        var VALOR_OTRA = '__otro__';

        var selector = document.getElementById('categoria-sel');
        var cajaOtra = document.getElementById('categoria-otra-caja');
        var campoOtra = document.getElementById('categoria-otra');
        var pista = document.getElementById('categoria-pista');
        var campoNombre = document.querySelector('input[name="nombre"]');

        var manual = false;
        var recomendada = false;
        var numero = 0;
        var numeroOtra = 0;
        var ultimoNombre = null;
        var temporizador = null;
        var temporizadorOtra = null;
        var vigilante = null;

        function clave(texto) {
            return String(texto || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .trim()
                .replace(/\s+/g, ' ');
        }

        function buscarOpcion(texto) {
            var buscada = clave(texto);

            for (var i = 0; i < selector.options.length; i++) {
                var opcion = selector.options[i];

                if (opcion.value !== '' && opcion.value !== VALOR_OTRA && clave(opcion.value) === buscada) {
                    return opcion;
                }
            }

            return null;
        }

        function mostrarOtra(visible) {
            cajaOtra.hidden = !visible;
            campoOtra.required = visible;

            if (!visible) {
                campoOtra.setCustomValidity('');
            }
        }

        function ocultarRecomendacion() {
            pista.hidden = true;
            pista.textContent = '';
        }

        function mostrarRecomendacion() {
            pista.textContent = '';

            var glifo = document.createElement('i');
            glifo.className = 'ti ti-sparkles';
            glifo.setAttribute('aria-hidden', 'true');

            var cuerpo = document.createElement('span');
            cuerpo.textContent = 'Categoría recomendada';

            pista.appendChild(glifo);
            pista.appendChild(cuerpo);
            pista.hidden = false;
        }

        function limpiarRecomendacion() {
            if (recomendada && !manual) {
                selector.value = '';
                mostrarOtra(false);
            }

            recomendada = false;
            ocultarRecomendacion();
        }

        function elegirPorTexto(texto) {
            var opcion = buscarOpcion(texto);

            if (opcion) {
                selector.value = opcion.value;
                mostrarOtra(false);
            } else {
                selector.value = VALOR_OTRA;
                campoOtra.value = texto;
                mostrarOtra(true);
            }
        }

        selector.addEventListener('change', function () {
            manual = true;
            recomendada = false;
            numero++;
            numeroOtra++;

            var esOtra = selector.value === VALOR_OTRA;

            mostrarOtra(esOtra);
            ocultarRecomendacion();

            if (esOtra) {
                campoOtra.focus();
            }

            if (vigilante) {
                clearInterval(vigilante);
                vigilante = null;
            }
        });

        async function comprobarOtra() {
            campoOtra.setCustomValidity('');

            var texto = campoOtra.value.trim();

            if (texto.length < 2) return;

            var mio = ++numeroOtra;

            try {
                var respuesta = await fetch('/productos/categoria-existente?texto=' + encodeURIComponent(texto), {
                    headers: { 'Accept': 'application/json' },
                    credentials: 'same-origin'
                });

                var tipo = respuesta.headers.get('Content-Type') || '';

                if (!respuesta.ok || tipo.indexOf('application/json') === -1) return;

                var datos = await respuesta.json();

                if (mio !== numeroOtra || selector.value !== VALOR_OTRA) return;

                if (datos && datos.existente) {
                    campoOtra.setCustomValidity('Esa categoría ya existe: «' + datos.existente + '». Elígela de la lista desplegable.');
                }

            } catch (e) { }
        }

        campoOtra.addEventListener('input', function () {
            numeroOtra++;
            campoOtra.setCustomValidity('');

            clearTimeout(temporizadorOtra);
            temporizadorOtra = setTimeout(comprobarOtra, 300);
        });

        async function sugerir() {
            if (manual || !esNuevo) return;

            var nombre = campoNombre.value.trim();

            if (nombre === ultimoNombre) return;

            ultimoNombre = nombre;

            var mio = ++numero;

            if (nombre.length < 3) {
                limpiarRecomendacion();
                return;
            }

            try {
                var respuesta = await fetch('/productos/sugerir-categoria?nombre=' + encodeURIComponent(nombre), {
                    headers: { 'Accept': 'application/json' },
                    credentials: 'same-origin'
                });

                var tipo = respuesta.headers.get('Content-Type') || '';

                if (!respuesta.ok || tipo.indexOf('application/json') === -1) {
                    console.warn('Categoría recomendada: respuesta inesperada del servidor', respuesta.status);
                    return;
                }

                var datos = await respuesta.json();

                if (mio !== numero || manual) return;

                var opcion = datos && datos.categoria ? buscarOpcion(datos.categoria) : null;

                if (opcion) {
                    selector.value = opcion.value;
                    mostrarOtra(false);
                    recomendada = true;
                    mostrarRecomendacion();
                } else {
                    limpiarRecomendacion();
                }

            } catch (e) {
                console.warn('Categoría recomendada: no se pudo consultar', e);
            }
        }

        function programar() {
            clearTimeout(temporizador);
            temporizador = setTimeout(sugerir, 250);
        }

        if (campoNombre && esNuevo) {

            ['input', 'change', 'keyup', 'paste', 'blur'].forEach(function (evento) {
                campoNombre.addEventListener(evento, programar);
            });

            vigilante = setInterval(function () {
                if (manual) {
                    clearInterval(vigilante);
                    vigilante = null;
                    return;
                }

                if (campoNombre.value.trim() !== ultimoNombre) {
                    programar();
                }
            }, 500);
        }

        if (categoriaActual && String(categoriaActual).trim() !== '') {
            elegirPorTexto(String(categoriaActual).trim());
            manual = true;
        }
    })();
</script>

</body>
</html>
