<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cambiar contraseña - Eternal Sunshine</title>

    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/alertas.css">

    <style>
        .tarjeta-clave { max-width:520px; padding:24px; border-radius:20px; background:#ffffff; box-shadow:0 4px 12px rgba(0,0,0,.15); }
        .campo { margin-bottom:18px; }
        .campo label { display:block; margin-bottom:6px; font-weight:bold; color:#4a1020; font-size:14px; }
        .campo-clave { position:relative; }
        .campo-clave input { width:100%; padding:12px 46px 12px 12px; border:2px solid #c29be7; border-radius:10px; font-family:inherit; font-size:16px; background:#ffffff; box-sizing:border-box; }
        .ver-clave { position:absolute; right:6px; bottom:6px; width:36px; height:36px; border:none; border-radius:8px; background:transparent; color:#8a6a73; cursor:pointer; font-size:20px; }
        .ver-clave:hover { background:rgba(74,16,32,.08); }

        .reglas { margin:0 0 20px; padding:12px 16px 12px 34px; border-radius:12px; background:#fdf6f8; color:#8a6a73; font-size:13px; line-height:1.6; }

        .botones { display:flex; gap:10px; flex-wrap:wrap; }
        .btn-principal { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:13px 22px; border:none; border-radius:10px; background:#df6794; color:#ffffff; font-family:inherit; font-size:15px; font-weight:800; cursor:pointer; }
        .btn-principal:hover { background:#cf4f81; }
        .btn-principal i { font-size:20px; }
        .btn-sec { display:inline-flex; align-items:center; justify-content:center; padding:13px 22px; border-radius:10px; background:#c29be7; color:#ffffff; font-size:15px; font-weight:800; text-decoration:none; }
    </style>
</head>
<body>

<div class="dashboard">

    <div class="sidebar">

        <div class="logo-container">
            <img src="/images/logo.png" class="logo">
            <h2>Eternal Sunshine</h2>
        </div>

        <div th:replace="~{fragments/menu :: menu}"></div>

    </div>

    <div class="content">

        <div class="header">
            <h1>Cambiar contraseña</h1>
        </div>

        <div class="tabla">

            <div th:replace="~{fragments/alertas :: alertas}"></div>

            <form method="post" action="/cuenta/contrasena" class="tarjeta-clave" autocomplete="off">

                <div class="campo">
                    <label for="cc-actual">Contraseña actual</label>
                    <div class="campo-clave">
                        <input type="password" id="cc-actual" name="actual" required
                               maxlength="64" autocomplete="current-password">
                        <button type="button" class="ver-clave" data-ver-clave="cc-actual" aria-label="Mostrar contraseña">
                            <i class="ti ti-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <div class="campo">
                    <label for="cc-nueva">Contraseña nueva</label>
                    <div class="campo-clave">
                        <input type="password" id="cc-nueva" name="nueva" required
                               minlength="8" maxlength="64" autocomplete="new-password">
                        <button type="button" class="ver-clave" data-ver-clave="cc-nueva" aria-label="Mostrar contraseña">
                            <i class="ti ti-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <div class="campo">
                    <label for="cc-confirmacion">Repite la contraseña nueva</label>
                    <div class="campo-clave">
                        <input type="password" id="cc-confirmacion" name="confirmacion" required
                               minlength="8" maxlength="64" autocomplete="new-password">
                        <button type="button" class="ver-clave" data-ver-clave="cc-confirmacion" aria-label="Mostrar contraseña">
                            <i class="ti ti-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <ul class="reglas">
                    <li>Entre 8 y 64 caracteres.</li>
                    <li>Al menos una letra y un número.</li>
                    <li>Distinta de tu nombre de usuario y de tu contraseña actual.</li>
                </ul>

                <div class="botones">
                    <button type="submit" class="btn-principal">
                        <i class="ti ti-key" aria-hidden="true"></i>
                        Guardar contraseña
                    </button>
                    <a href="/" class="btn-sec">Volver</a>
                </div>

            </form>

        </div>

    </div>

</div>

<script src="/js/alertas.js"></script>

<script>
    document.querySelectorAll('[data-ver-clave]').forEach(function (boton) {
        boton.addEventListener('click', function () {
            var campo = document.getElementById(boton.getAttribute('data-ver-clave'));

            if (!campo) return;

            var oculto = campo.type === 'password';

            campo.type = oculto ? 'text' : 'password';

            var icono = boton.querySelector('i');

            if (icono) {
                icono.className = 'ti ' + (oculto ? 'ti-eye-off' : 'ti-eye');
            }

            boton.setAttribute('aria-label', oculto ? 'Ocultar contraseña' : 'Mostrar contraseña');
        });
    });

    (function () {
        var nueva = document.getElementById('cc-nueva');
        var confirmacion = document.getElementById('cc-confirmacion');

        function comprobar() {
            confirmacion.setCustomValidity(
                confirmacion.value !== '' && confirmacion.value !== nueva.value
                    ? 'Las contraseñas no coinciden.'
                    : '');
        }

        nueva.addEventListener('input', comprobar);
        confirmacion.addEventListener('input', comprobar);
    })();
</script>

</body>
</html>
