<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recibir mercancía - Eternal Sunshine</title>

    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/escaner.css">
    <link rel="stylesheet" href="/css/confirmar.css">

    <style>
        .venta-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }
        @media (max-width:900px) { .venta-grid { grid-template-columns:1fr; } }

        .panel { background:white; padding:20px; border-radius:20px; box-shadow:0 4px 12px rgba(0,0,0,.15); }
        .panel h3 { margin-top:0; color:#df6794; }

        .buscador-fila { display:flex; gap:10px; }
        #buscador { flex:1; min-width:0; padding:14px; border:2px solid #c29be7; border-radius:10px; font-size:16px; box-sizing:border-box; }
        #btn-escanear { white-space:nowrap; }

        .resultado-item { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid #eee; flex-wrap:wrap; }
        .resultado-item small { display:block; color:#777; }
        .resultado-item .acciones { display:flex; gap:8px; align-items:center; }
        .resultado-item input { width:64px; padding:8px; border:2px solid #c29be7; border-radius:8px; }
        .sin-resultados { color:#888; text-align:center; padding:14px; }

        .vbtn { background:#df6794; color:white; border:none; padding:9px 14px; border-radius:8px; cursor:pointer; font-weight:bold; font-family:inherit; font-size:14px; }
        .vbtn:disabled { background:#ccc; cursor:not-allowed; }
        .vbtn-sec { background:#c29be7; }
        .vbtn-chico { padding:6px 9px; }
        .vbtn i { font-size:1.15em; vertical-align:-2px; }

        .lista-tabla { width:100%; border-collapse:collapse; }
        .lista-tabla th { background:#df6794; color:white; padding:10px; text-align:left; }
        .lista-tabla td { padding:10px; border-bottom:1px solid #eee; vertical-align:middle; }
        .lista-tabla small { display:block; color:#777; }
        .lista-tabla .vacio { text-align:center; color:#888; padding:24px; }
        .cant-ctrl { display:flex; align-items:center; gap:6px; }
        .cant-ctrl input { width:72px; text-align:center; padding:6px; border:2px solid #c29be7; border-radius:8px; font-size:15px; box-sizing:border-box; }
        .nuevo-stock { color:#2e9d57; font-weight:bold; }

        .campos-factura { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
        .campos-factura .campo-ancho { grid-column:1 / -1; }
        .campos-factura label, .campo-nota label { display:block; font-weight:bold; color:#4a1020; margin:0 0 6px; font-size:14px; }
        .campos-factura input { width:100%; box-sizing:border-box; padding:10px; border:2px solid #c29be7; border-radius:10px; font-family:inherit; font-size:15px; }
        .obligatorio { color:#b83255; }

        .campo-nota { margin-top:14px; }
        #nota { width:100%; box-sizing:border-box; padding:10px; border:2px solid #c29be7; border-radius:10px; font-family:inherit; font-size:15px; resize:vertical; }

        .lista-pie { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:14px; flex-wrap:wrap; }
        #resumen-lista { color:#4a1020; font-weight:bold; }
        #btn-registrar { width:100%; padding:16px; font-size:17px; border-radius:12px; margin-top:12px; }

        #aviso { display:none; position:fixed; top:20px; left:50%; transform:translateX(-50%); padding:12px 22px; border-radius:12px; font-weight:bold; box-shadow:0 4px 14px rgba(0,0,0,.25); z-index:1000; max-width:90%; text-align:center; }
        .aviso-error { background:#fdd; color:#900; }
        .aviso-ok { background:#dfd; color:#060; }
    </style>
</head>
<body>

<div id="aviso" role="status" aria-live="polite"></div>

<div class="dashboard">

    <div class="sidebar">

        <div class="logo-container">
            <img src="/images/logo.png" class="logo">
            <h2>Eternal Sunshine</h2>
        </div>

        <div th:replace="~{fragments/menu :: menu}"></div>

    </div>

    <div class="content">

        <div class="header">
            <h1>Recibir mercancía</h1>
        </div>

        <div class="venta-grid">

            <div class="panel">
                <h3>Buscar producto</h3>

                <div class="buscador-fila">
                    <input type="text" id="buscador" placeholder="Escribe el código o el nombre..." autocomplete="off" autofocus>
                    <button type="button" class="vbtn" id="btn-escanear"><i class="ti ti-scan" aria-hidden="true"></i> Escanear</button>
                </div>

                <div id="escaner-montaje" style="display:none;"></div>

                <div id="resultados" style="margin-top:10px;"></div>
            </div>

            <div class="panel">
                <h3>Lo que llegó</h3>

                <table class="lista-tabla">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Stock</th>
                            <th>Cantidad</th>
                            <th>Quedará en</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="lista-body"></tbody>
                </table>

                <div class="campos-factura">

                    <div class="campo-ancho">
                        <label for="proveedor">Proveedor <span class="obligatorio">*</span></label>
                        <input type="text" id="proveedor" list="lista-proveedores" maxlength="100"
                               autocomplete="off" placeholder="Ej.: Alpina, Postobón, panadería local...">
                        <datalist id="lista-proveedores">
                            <option th:each="p : ${proveedores}" th:value="${p}"></option>
                        </datalist>
                    </div>

                    <div>
                        <label for="factura">N.º de factura</label>
                        <input type="text" id="factura" maxlength="50" autocomplete="off" placeholder="Opcional">
                    </div>

                    <div>
                        <label for="fecha-factura">Fecha de la factura</label>
                        <input type="date" id="fecha-factura">
                    </div>

                </div>

                <div class="campo-nota">
                    <label for="nota">Nota (opcional)</label>
                    <textarea id="nota" rows="2" maxlength="200" placeholder="Cualquier detalle de la entrega..."></textarea>
                </div>

                <div class="lista-pie">
                    <button type="button" class="vbtn vbtn-sec" id="btn-vaciar">Vaciar lista</button>
                    <div id="resumen-lista">0 productos · 0 unidades</div>
                </div>

                <button type="button" class="vbtn" id="btn-registrar" disabled><i class="ti ti-package-import" aria-hidden="true"></i> Registrar entrada</button>
            </div>

        </div>

    </div>

</div>

<script src="/js/quagga.min.js"></script>
<script src="/js/escaner.js"></script>
<script src="/js/confirmar.js"></script>

<script th:inline="javascript">
    const productos = /*[[${productos}]]*/ [];
    const preProducto = /*[[${preProducto}]]*/ null;
    const preCantidad = /*[[${preCantidad}]]*/ null;
    const CANTIDAD_MAXIMA = 100000;

    let lista = [];

    const buscador = document.getElementById('buscador');
    const resultados = document.getElementById('resultados');
    const btnEscanear = document.getElementById('btn-escanear');
    const btnRegistrar = document.getElementById('btn-registrar');
    const btnVaciar = document.getElementById('btn-vaciar');
    const notaCampo = document.getElementById('nota');
    const proveedorCampo = document.getElementById('proveedor');
    const facturaCampo = document.getElementById('factura');
    const fechaFacturaCampo = document.getElementById('fecha-factura');

    function fechaLocal() {
        const d = new Date();
        const mes = String(d.getMonth() + 1).padStart(2, '0');
        const dia = String(d.getDate()).padStart(2, '0');
        return d.getFullYear() + '-' + mes + '-' + dia;
    }

    fechaFacturaCampo.max = fechaLocal();
    fechaFacturaCampo.value = fechaLocal();

    let avisoTimer;
    function aviso(texto, tipo) {
        const a = document.getElementById('aviso');
        a.textContent = texto;
        a.className = (tipo === 'ok') ? 'aviso-ok' : 'aviso-error';
        a.style.display = 'block';
        clearTimeout(avisoTimer);
        avisoTimer = setTimeout(function () { a.style.display = 'none'; }, 4000);

        if (tipo !== 'ok' && typeof EscanerCodigo !== 'undefined') {
            EscanerCodigo.pitidoError();
        }
    }

    function crear(tag, texto, clase) {
        const e = document.createElement(tag);
        if (texto !== undefined && texto !== null) e.textContent = texto;
        if (clase) e.className = clase;
        return e;
    }

    function icono(clase) {
        const i = document.createElement('i');
        i.className = 'ti ' + clase;
        i.setAttribute('aria-hidden', 'true');
        return i;
    }

    function ponerBoton(boton, clase, texto) {
        boton.textContent = '';
        if (clase) boton.appendChild(icono(clase));
        boton.appendChild(document.createTextNode(' ' + texto));
    }

    function enLista(productoId) {
        return lista.find(function (i) { return i.productoId === productoId; });
    }

    function filtrar() {
        const texto = buscador.value.trim().toLowerCase();
        resultados.innerHTML = '';
        if (texto === '') return;

        const encontrados = productos.filter(function (p) {
            return p.nombre.toLowerCase().includes(texto) || p.codigo.toLowerCase().includes(texto);
        }).slice(0, 8);

        if (encontrados.length === 0) {
            resultados.appendChild(crear('div', 'No se encontraron productos.', 'sin-resultados'));
            return;
        }

        encontrados.forEach(function (p) {
            const fila = crear('div', null, 'resultado-item');

            const info = crear('div');
            info.appendChild(crear('strong', p.nombre));
            info.appendChild(crear('small', p.codigo + ' · Stock actual: ' + p.cantidad));
            fila.appendChild(info);

            const acciones = crear('div', null, 'acciones');

            const cant = document.createElement('input');
            cant.type = 'number';
            cant.min = '1';
            cant.max = String(CANTIDAD_MAXIMA);
            cant.value = '1';

            const boton = crear('button', null, 'vbtn');
            boton.type = 'button';
            ponerBoton(boton, 'ti-plus', 'Agregar');
            boton.addEventListener('click', function () {
                agregar(p, parseInt(cant.value, 10));
            });

            acciones.appendChild(cant);
            acciones.appendChild(boton);
            fila.appendChild(acciones);
            resultados.appendChild(fila);
        });
    }

    function agregar(p, cantidad, sinFoco) {
        if (!Number.isInteger(cantidad) || cantidad <= 0) {
            aviso('Ingresa una cantidad válida.', 'error');
            return false;
        }

        const existente = enLista(p.id);
        const total = (existente ? existente.cantidad : 0) + cantidad;

        if (total > CANTIDAD_MAXIMA) {
            aviso('La cantidad máxima por producto es 100.000.', 'error');
            return false;
        }

        if (existente) {
            existente.cantidad = total;
        } else {
            lista.push({ productoId: p.id, nombre: p.nombre, codigo: p.codigo, stock: p.cantidad, cantidad: cantidad });
        }

        buscador.value = '';
        resultados.innerHTML = '';
        if (!sinFoco) {
            buscador.focus();
        }
        render();
        return true;
    }

    function cambiarCantidad(productoId, delta) {
        const item = enLista(productoId);
        if (!item) return;

        const nueva = item.cantidad + delta;

        if (nueva <= 0) {
            quitar(productoId);
            return;
        }

        if (nueva > CANTIDAD_MAXIMA) {
            aviso('La cantidad máxima por producto es 100.000.', 'error');
            return;
        }

        item.cantidad = nueva;
        render();
    }

    function fijarCantidad(productoId, valor) {
        const item = enLista(productoId);
        if (!item) return;

        const numero = parseInt(valor, 10);

        if (!Number.isInteger(numero) || numero <= 0 || numero > CANTIDAD_MAXIMA) {
            aviso('La cantidad debe ser un número entre 1 y 100.000.', 'error');
            render();
            return;
        }

        item.cantidad = numero;
        render();
    }

    function quitar(productoId) {
        lista = lista.filter(function (i) { return i.productoId !== productoId; });
        render();
    }

    function render() {
        const tbody = document.getElementById('lista-body');
        tbody.innerHTML = '';

        let unidades = 0;

        if (lista.length === 0) {
            const tr = document.createElement('tr');
            const td = crear('td', 'Aún no hay productos. Busca o escanea lo que llegó.', 'vacio');
            td.colSpan = 5;
            tr.appendChild(td);
            tbody.appendChild(tr);
        }

        lista.forEach(function (item) {
            unidades += item.cantidad;

            const tr = document.createElement('tr');

            const tdNombre = document.createElement('td');
            tdNombre.appendChild(crear('strong', item.nombre));
            tdNombre.appendChild(crear('small', item.codigo));
            tr.appendChild(tdNombre);

            tr.appendChild(crear('td', String(item.stock)));

            const tdCant = document.createElement('td');
            const ctrl = crear('div', null, 'cant-ctrl');

            const menos = crear('button', null, 'vbtn vbtn-chico');
            menos.type = 'button';
            menos.setAttribute('aria-label', 'Restar una unidad');
            menos.appendChild(icono('ti-minus'));
            menos.addEventListener('click', function () { cambiarCantidad(item.productoId, -1); });

            const campo = document.createElement('input');
            campo.type = 'number';
            campo.min = '1';
            campo.max = String(CANTIDAD_MAXIMA);
            campo.value = String(item.cantidad);
            campo.setAttribute('aria-label', 'Cantidad que llegó de ' + item.nombre);
            campo.addEventListener('change', function () { fijarCantidad(item.productoId, campo.value); });
            campo.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    campo.blur();
                }
            });

            const mas = crear('button', null, 'vbtn vbtn-chico');
            mas.type = 'button';
            mas.setAttribute('aria-label', 'Sumar una unidad');
            mas.appendChild(icono('ti-plus'));
            mas.addEventListener('click', function () { cambiarCantidad(item.productoId, 1); });

            ctrl.appendChild(menos);
            ctrl.appendChild(campo);
            ctrl.appendChild(mas);
            tdCant.appendChild(ctrl);
            tr.appendChild(tdCant);

            tr.appendChild(crear('td', String(item.stock + item.cantidad), 'nuevo-stock'));

            const tdQuitar = document.createElement('td');
            const quitarBtn = crear('button', null, 'vbtn vbtn-sec vbtn-chico');
            quitarBtn.type = 'button';
            quitarBtn.setAttribute('aria-label', 'Quitar ' + item.nombre + ' de la lista');
            quitarBtn.appendChild(icono('ti-x'));
            quitarBtn.addEventListener('click', function () { quitar(item.productoId); });
            tdQuitar.appendChild(quitarBtn);
            tr.appendChild(tdQuitar);

            tbody.appendChild(tr);
        });

        document.getElementById('resumen-lista').textContent =
            lista.length + (lista.length === 1 ? ' producto' : ' productos') + ' · ' +
            unidades + (unidades === 1 ? ' unidad' : ' unidades');

        btnRegistrar.disabled = lista.length === 0;
    }

    buscador.addEventListener('input', filtrar);

    buscador.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();

        const texto = buscador.value.trim().toLowerCase();
        if (texto === '') return;

        let p = productos.find(function (x) { return x.codigo.toLowerCase() === texto; });
        const porCodigo = !!p;

        if (!p) {
            p = productos.find(function (x) {
                return x.nombre.toLowerCase().includes(texto) || x.codigo.toLowerCase().includes(texto);
            });
        }

        if (!p) {
            aviso('No se encontró ningún producto.', 'error');
            return;
        }

        if (agregar(p, 1) && porCodigo) {
            EscanerCodigo.pitido();
        }
    });

    let vaciarListo = false;
    let vaciarTimer;

    btnVaciar.addEventListener('click', function () {
        if (lista.length === 0) return;

        if (!vaciarListo) {
            vaciarListo = true;
            btnVaciar.textContent = '¿Confirmar?';
            vaciarTimer = setTimeout(function () {
                vaciarListo = false;
                btnVaciar.textContent = 'Vaciar lista';
            }, 3000);
            return;
        }

        clearTimeout(vaciarTimer);
        vaciarListo = false;
        btnVaciar.textContent = 'Vaciar lista';
        lista = [];
        render();
        aviso('Lista vacía.', 'ok');
    });

    async function enviar(confirmarDuplicada) {
        btnRegistrar.disabled = true;
        ponerBoton(btnRegistrar, 'ti-loader-2', 'Registrando...');

        try {
            const respuesta = await fetch('/entradas/registrar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nota: notaCampo.value,
                    proveedor: proveedorCampo.value,
                    numeroFactura: facturaCampo.value,
                    fechaFactura: fechaFacturaCampo.value,
                    confirmarDuplicada: confirmarDuplicada === true,
                    lineas: lista.map(function (i) {
                        return { productoId: i.productoId, cantidad: i.cantidad };
                    })
                })
            });

            let datos = null;
            try {
                datos = await respuesta.json();
            } catch (e) { }

            if (respuesta.ok && datos && datos.ok) {
                window.location.href = '/entradas?registradas=' + datos.cantidad;
                return;
            }

            if (respuesta.status === 409 && datos && datos.duplicada) {
                btnRegistrar.disabled = lista.length === 0;
                ponerBoton(btnRegistrar, 'ti-package-import', 'Registrar entrada');

                Confirmar.preguntar({
                    icono: 'ti-alert-triangle',
                    titulo: 'Esta factura ya fue registrada',
                    mensaje: datos.mensaje,
                    textoConfirmar: 'Registrar de todos modos',
                    tipo: 'peligro'
                }, function () {
                    enviar(true);
                });

                return;
            }

            aviso((datos && datos.mensaje) || 'No se pudo registrar la entrada.', 'error');

        } catch (e) {
            aviso('No se pudo registrar la entrada. Revisa tu conexión o vuelve a iniciar sesión.', 'error');
        }

        btnRegistrar.disabled = lista.length === 0;
        ponerBoton(btnRegistrar, 'ti-package-import', 'Registrar entrada');
    }

    btnRegistrar.addEventListener('click', function () {
        if (lista.length === 0) return;

        const proveedor = proveedorCampo.value.trim();

        if (proveedor === '') {
            aviso('Escribe el proveedor de la mercancía.', 'error');
            proveedorCampo.focus();
            return;
        }

        let unidades = 0;
        lista.forEach(function (i) { unidades += i.cantidad; });

        const factura = facturaCampo.value.trim();

        Confirmar.preguntar({
            icono: 'ti-package-import',
            titulo: '¿Registrar la entrada?',
            mensaje: 'Vas a sumar ' + unidades + (unidades === 1 ? ' unidad' : ' unidades') +
                ' de ' + lista.length + (lista.length === 1 ? ' producto' : ' productos') + ' al inventario. ' +
                'Proveedor: ' + proveedor + (factura !== '' ? ' · Factura ' + factura : '') + '.',
            textoConfirmar: 'Sí, registrar',
            tipo: 'exito',
            enfocarAceptar: true
        }, function () {
            enviar(false);
        });
    });

    function normalizar(codigo) {
        const t = String(codigo).trim();
        return /^\d+$/.test(t) ? t.replace(/^0+/, '') : t.toLowerCase();
    }

    function buscarParecido(codigo) {
        const leido = String(codigo).trim();

        if (!/^\d{13}$/.test(leido)) return null;

        const cola = leido.slice(-6);

        const candidatos = productos.filter(function (p) {
            const c = String(p.codigo).trim();
            return /^\d{13}$/.test(c) && c.slice(-6) === cola;
        });

        return candidatos.length === 1 ? candidatos[0] : null;
    }

    function preguntarParecido(leido, producto) {
        escaner.pausar();
        EscanerCodigo.pitidoAviso();

        Confirmar.preguntar({
            icono: 'ti-search',
            titulo: '¿Quisiste decir este producto?',
            mensaje: 'Leí ' + leido + ', que no está registrado, pero termina igual que «' + producto.nombre + '» (' + producto.codigo + ').',
            textoConfirmar: 'Sí, agregar',
            textoCancelar: 'No',
            enfocarAceptar: true
        }, function () {
            escaner.reanudar();

            if (agregar(producto, 1, true)) {
                EscanerCodigo.pitido();
                aviso('Agregado a la lista: ' + producto.nombre, 'ok');
                escaner.marcar('ok');
            } else {
                escaner.marcar('error');
            }
        }, function () {
            escaner.reanudar();
            aviso('Código no encontrado: ' + leido, 'error');
            escaner.marcar('error');
        });
    }

    function procesarCodigo(codigo) {
        try {
            const buscado = normalizar(codigo);
            const p = productos.find(function (x) { return normalizar(x.codigo) === buscado; });

            if (p) {
                if (agregar(p, 1, true)) {
                    EscanerCodigo.pitido();
                    aviso('Agregado a la lista: ' + p.nombre, 'ok');
                    return true;
                }

                return false;
            }

            const parecido = buscarParecido(codigo);

            if (parecido) {
                preguntarParecido(codigo, parecido);
                return 'pendiente';
            }

            aviso('Código no encontrado: ' + codigo + '. Si es un producto nuevo, regístralo primero en Productos.', 'error');
            return false;

        } catch (e) {
            aviso('No se pudo procesar el código leído.', 'error');
            return false;
        }
    }

    const escaner = EscanerCodigo.crear({
        montaje: document.getElementById('escaner-montaje'),
        alIniciar: function () {
            btnEscanear.disabled = true;
            ponerBoton(btnEscanear, 'ti-camera', 'Abriendo cámara...');
        },
        alActivar: function () {
            ponerBoton(btnEscanear, 'ti-camera', 'Cámara activa');
        },
        alCerrar: function () {
            btnEscanear.disabled = false;
            ponerBoton(btnEscanear, 'ti-scan', 'Escanear');
        },
        alError: function (mensaje) {
            aviso(mensaje, 'error');
        },
        alLeer: function (codigo) {
            return procesarCodigo(codigo);
        }
    });

    btnEscanear.addEventListener('click', function () { escaner.abrir(); });
    window.addEventListener('pagehide', function () { escaner.cerrar(); });

    if (preProducto !== null && preProducto !== undefined) {
        const pre = productos.find(function (p) { return p.id === preProducto; });

        if (pre) {
            const cantidadInicial = (Number.isInteger(preCantidad) && preCantidad > 0)
                ? Math.min(preCantidad, CANTIDAD_MAXIMA)
                : 1;
            agregar(pre, cantidadInicial, true);
        }
    }

    render();
    buscador.focus();
</script>

</body>
</html>
