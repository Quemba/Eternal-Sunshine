<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos - Eternal Sunshine</title>

    <link rel="stylesheet"
          href="/css/dashboard.css">
</head>
<body>

<div class="dashboard">

    <div class="sidebar">

        <div class="logo-container">

            <img src="/images/logo.png"
                 class="logo">

            <h2>Eternal Sunshine</h2>

        </div>

        <div class="menu">

            <a href="/">Dashboard</a>

            <a href="/productos">Productos</a>

            <a href="#">Usuarios</a>

            <a href="/historial">Historial</a>

            <a href="/login">Cerrar Sesión</a>

        </div>

    </div>

    <div class="content">

        <div class="header">

            <h1>Inventario de Productos</h1>

        </div>

        <div class="tabla">

            <div class="toolbar">

    <form action="/productos"
      method="get"
      class="search-box">

    <img src="/images/search.png"
         width="24">

    <input type="text"
           name="buscar"
           th:value="${buscar}"
           placeholder="Buscar producto...">

    <button type="submit"
            style="display:none;">
    </button>

</form>

    <div class="actions">

        <a href="/productos/nuevo"
            class="action-btn btn-add">

        <img src="/images/add.png">

        Agregar

        </a>

        <a href="/productos/exportar"
   class="action-btn btn-export">

    <img src="/images/export.png">

    Exportar

</a>


    </div>

</div>

            <h3>Productos Registrados</h3>

            <table style="width:100%; border-collapse: collapse;">

                <thead>

                <tr style="background:#df6794; color:white;">

                    <th style="padding:10px;">Código</th>

                    <th style="padding:10px;">Nombre</th>

                    <th style="padding:10px;">Categoría</th>

                    <th style="padding:10px;">Precio</th>

                    <th style="padding:10px;">Cantidad</th>

                    <th style="padding:10px;">Acciones</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="producto : ${productos}">

                    <td style="padding:10px;"
                        th:text="${producto.codigo}">
                    </td>

                    <td style="padding:10px;"
                        th:text="${producto.nombre}">
                    </td>

                    <td style="padding:10px;"
                        th:text="${producto.categoria}">
                    </td>

                    <td style="padding:10px;"
                        th:text="${producto.precio}">
                    </td>

                    <td style="padding:10px;"
                        th:text="${producto.cantidad}">
                    </td>

                    <td style="padding:10px;">

    <a th:href="@{/productos/editar/{id}(id=${producto.id})}">
        ✏️
    </a>

    &nbsp;&nbsp;

    <a th:href="@{/productos/eliminar/{id}(id=${producto.id})}"
       onclick="return confirm('¿Eliminar producto?')">
        🗑️
    </a>

</td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
