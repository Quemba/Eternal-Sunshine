<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ventas - Eternal Sunshine</title>

    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/listas.css">

    <style>
        .etiqueta { padding:4px 12px; border-radius:12px; font-weight:bold; font-size:13px; white-space:nowrap; }
        .etiqueta-ok { background:#e6f5ea; color:#1f6b3a; }
        .etiqueta-anulada { background:#eee; color:#777; }
        .fila-anulada td { color:#999; }
        .total-anulado { text-decoration:line-through; }
    </style>
</head>
<body>

<div class="dashboard">

    <div class="sidebar">

        <div class="logo-container">
            <img src="/images/logo.png" class="logo">
            <h2>Eternal Sunshine</h2>
        </div>

        <div th:replace="~{fragments/menu :: menu}"></div>

    </div>

    <div class="content">

        <div class="header">
            <h1 th:text="${esAdmin} ? 'Ventas Registradas' : 'Mis Ventas'"></h1>
        </div>

        <div class="tabla">

            <div style="margin-bottom:20px;">
                <a href="/ventas/nueva" class="action-btn btn-add">
                    <i class="ti ti-shopping-cart-plus" aria-hidden="true"></i>
                    Nueva venta
                </a>
            </div>

            <form method="get" action="/ventas" class="filtros" id="form-filtros" role="search">

                <div class="filtro filtro-texto">
                    <label for="f-q">Buscar</label>
                    <div class="entrada-icono">
                        <i class="ti ti-search" aria-hidden="true"></i>
                        <input type="text" id="f-q" name="q" th:value="${q}"
                               autocomplete="off"
                               placeholder="N.º de venta (VEN-… o 12), producto o código...">
                    </div>
                </div>

                <div class="filtro" th:if="${esAdmin}">
                    <label for="f-vendedor">Vendedor</label>
                    <select id="f-vendedor" name="vendedor">
                        <option value="">Todos</option>
                        <option th:each="u : ${usuarios}"
                                th:value="${u.id}"
                                th:text="${u.username}"
                                th:selected="${vendedorId != null and vendedorId == u.id}"></option>
                    </select>
                </div>

                <div class="filtro">
                    <label for="f-estado">Estado</label>
                    <select id="f-estado" name="estado">
                        <option value="">Todas</option>
                        <option value="vigente" th:selected="${estado == 'vigente'}">Vigentes</option>
                        <option value="anulada" th:selected="${estado == 'anulada'}">Anuladas</option>
                    </select>
                </div>

                <div class="filtro">
                    <label for="f-desde">Desde</label>
                    <input type="date" id="f-desde" name="desde" th:value="${desde}">
                </div>

                <div class="filtro">
                    <label for="f-hasta">Hasta</label>
                    <input type="date" id="f-hasta" name="hasta" th:value="${hasta}">
                </div>

                <div class="filtro filtro-botones">
                    <button type="button" class="btn-limpiar" data-limpiar hidden>Limpiar</button>
                </div>

            </form>

            <div id="resultados-ventas" class="zona-viva" aria-live="polite">

                <p class="resumen" th:if="${resultado.total > 0}">
                    Mostrando
                    <strong th:text="${resultado.desdeRegistro}"></strong>–<strong th:text="${resultado.hastaRegistro}"></strong>
                    de <strong th:text="${resultado.total}"></strong>
                    <span th:text="${resultado.total == 1} ? 'venta' : 'ventas'"></span>
                </p>

                <p class="vacio" th:if="${resultado.total == 0}">
                    <span th:if="${hayFiltros}">No hay ventas con esos filtros. <a href="/ventas" data-limpiar-todo>Limpiar filtros</a></span>
                    <span th:unless="${hayFiltros}">Todavía no hay ventas registradas.</span>
                </p>

                <table th:if="${resultado.total > 0}" style="width:100%; border-collapse: collapse;">

                    <thead>

                    <tr style="background:#df6794; color:white;">

                        <th style="padding:10px;">Venta</th>

                        <th style="padding:10px;">Fecha</th>

                        <th style="padding:10px;">Vendedor</th>

                        <th style="padding:10px;">Productos</th>

                        <th style="padding:10px;">Total</th>

                        <th style="padding:10px;">Estado</th>

                        <th style="padding:10px;">Detalle</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="v : ${resultado.filas}"
                        th:classappend="${v.anulada == true} ? 'fila-anulada'">

                        <td style="padding:10px; white-space:nowrap;"><strong th:text="${v.numero}"></strong></td>

                        <td style="padding:10px;"
                            th:text="${#temporals.format(v.fecha, 'dd/MM/yyyy HH:mm')}"></td>

                        <td style="padding:10px;"
                            th:text="${v.usuario != null} ? ${v.usuario.username} : '-'"></td>

                        <td style="padding:10px;" th:text="${#lists.size(v.detalles)}"></td>

                        <td style="padding:10px;"
                            th:classappend="${v.anulada == true} ? 'total-anulado'"
                            th:text="'$ ' + ${#numbers.formatInteger(v.total, 1, 'POINT')}"></td>

                        <td style="padding:10px;">
                            <span th:if="${v.anulada == true}"
                                  class="etiqueta etiqueta-anulada"
                                  th:title="'Anulada el ' + ${#temporals.format(v.fechaAnulacion, 'dd/MM/yyyy HH:mm')}">Anulada</span>
                            <span th:unless="${v.anulada == true}"
                                  class="etiqueta etiqueta-ok">Vigente</span>
                        </td>

                        <td style="padding:10px;">
                            <a th:href="@{/ventas/{id}(id=${v.id})}"
                               class="enlace-icono ic-editar"
                               title="Ver detalle de la venta">
                                <i class="ti ti-eye" aria-hidden="true"></i>
                            </a>
                        </td>

                    </tr>

                    </tbody>

                </table>

                <div th:replace="~{fragments/paginacion :: nav(${resultado})}"></div>

            </div>

        </div>

    </div>

</div>

<script src="/js/lista-viva.js"></script>

<script>
    ListaViva.iniciar({
        formulario: '#form-filtros',
        zona: '#resultados-ventas',
        url: '/ventas'
    });
</script>

</body>
</html>
