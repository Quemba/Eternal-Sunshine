<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Entradas de mercancía - Eternal Sunshine</title>

    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/confirmar.css">
    <link rel="stylesheet" href="/css/alertas.css">
    <link rel="stylesheet" href="/css/listas.css">

    <style>
        .etiqueta { padding:4px 12px; border-radius:12px; font-weight:bold; font-size:13px; }
        .etiqueta-ok { background:#e6f5ea; color:#1f6b3a; }
        .etiqueta-anulada { background:#eee; color:#777; }
        .fila-anulada td { color:#999; }
        .mas-cantidad { color:#2e9d57; font-weight:bold; }
        .fila-anulada .mas-cantidad { color:#999; }
        .sub { display:block; color:#777; font-size:12px; }
        .num-entrada { white-space:nowrap; font-weight:800; }
    </style>
</head>
<body>

<div class="dashboard">

    <div class="sidebar">

        <div class="logo-container">
            <img src="/images/logo.png" class="logo">
            <h2>Eternal Sunshine</h2>
        </div>

        <div th:replace="~{fragments/menu :: menu}"></div>

    </div>

    <div class="content">

        <div class="header">
            <h1>Entradas de mercancía</h1>
        </div>

        <div class="tabla">

            <div th:replace="~{fragments/alertas :: alertas}"></div>

            <div style="margin-bottom:20px;">
                <a href="/entradas/nueva" class="action-btn btn-add">
                    <i class="ti ti-package-import" aria-hidden="true"></i>
                    Recibir mercancía
                </a>
            </div>

            <form method="get" action="/entradas" class="filtros" id="form-filtros" role="search">

                <div class="filtro filtro-texto">
                    <label for="f-q">Buscar</label>
                    <div class="entrada-icono">
                        <i class="ti ti-search" aria-hidden="true"></i>
                        <input type="text" id="f-q" name="q" th:value="${q}"
                               autocomplete="off"
                               placeholder="N.º (ENT-… o 4), proveedor, factura, producto o nota...">
                    </div>
                </div>

                <div class="filtro">
                    <label for="f-proveedor">Proveedor</label>
                    <select id="f-proveedor" name="proveedor">
                        <option value="">Todos</option>
                        <option th:each="p : ${proveedores}"
                                th:value="${p}"
                                th:text="${p}"
                                th:selected="${proveedorSel == p}"></option>
                    </select>
                </div>

                <div class="filtro">
                    <label for="f-estado">Estado</label>
                    <select id="f-estado" name="estado">
                        <option value="">Todos</option>
                        <option value="activa" th:selected="${estado == 'activa'}">Activas</option>
                        <option value="anulada" th:selected="${estado == 'anulada'}">Anuladas</option>
                    </select>
                </div>

                <div class="filtro">
                    <label for="f-desde">Desde</label>
                    <input type="date" id="f-desde" name="desde" th:value="${desde}">
                </div>

                <div class="filtro">
                    <label for="f-hasta">Hasta</label>
                    <input type="date" id="f-hasta" name="hasta" th:value="${hasta}">
                </div>

                <div class="filtro filtro-botones">
                    <button type="button" class="btn-limpiar" data-limpiar hidden>Limpiar</button>
                </div>

            </form>

            <div id="resultados-entradas" class="zona-viva" aria-live="polite">

                <p class="resumen" th:if="${resultado.total > 0}">
                    Mostrando
                    <strong th:text="${resultado.desdeRegistro}"></strong>–<strong th:text="${resultado.hastaRegistro}"></strong>
                    de <strong th:text="${resultado.total}"></strong>
                    <span th:text="${resultado.total == 1} ? 'entrada' : 'entradas'"></span>
                </p>

                <p class="vacio" th:if="${resultado.total == 0}">
                    <span th:if="${hayFiltros}">No hay entradas con esos filtros. <a href="/entradas" data-limpiar-todo>Limpiar filtros</a></span>
                    <span th:unless="${hayFiltros}">Todavía no hay entradas registradas.</span>
                </p>

                <table th:if="${resultado.total > 0}" style="width:100%; border-collapse: collapse;">

                    <thead>

                    <tr style="background:#df6794; color:white;">

                        <th style="padding:10px;">Número</th>

                        <th style="padding:10px;">Fecha</th>

                        <th style="padding:10px;">Producto</th>

                        <th style="padding:10px;">Cantidad</th>

                        <th style="padding:10px;">Stock</th>

                        <th style="padding:10px;">Proveedor</th>

                        <th style="padding:10px;">Factura</th>

                        <th style="padding:10px;">Registró</th>

                        <th style="padding:10px;">Nota</th>

                        <th style="padding:10px;">Estado</th>

                        <th style="padding:10px;" th:if="${esAdmin}">Acciones</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="e : ${resultado.filas}"
                        th:classappend="${e.anulada == true} ? 'fila-anulada'">

                        <td style="padding:10px;" class="num-entrada" th:text="${e.numero}"></td>

                        <td style="padding:10px;"
                            th:text="${#temporals.format(e.fecha, 'dd/MM/yyyy HH:mm')}"></td>

                        <td style="padding:10px;"
                            th:text="${e.producto != null} ? ${e.producto.nombre} : '(producto eliminado)'"></td>

                        <td style="padding:10px;">
                            <span class="mas-cantidad" th:text="'+' + ${e.cantidad}"></span>
                        </td>

                        <td style="padding:10px;"
                            th:text="${e.stockAntes} + ' → ' + ${e.stockDespues}"></td>

                        <td style="padding:10px;"
                            th:text="${e.proveedor} ?: '-'"></td>

                        <td style="padding:10px;">
                            <span th:if="${e.numeroFactura != null}" th:text="${e.numeroFactura}"></span>
                            <span class="sub" th:if="${e.numeroFactura != null and e.fechaFactura != null}"
                                  th:text="${#temporals.format(e.fechaFactura, 'dd/MM/yyyy')}"></span>
                            <span th:if="${e.numeroFactura == null}">-</span>
                        </td>

                        <td style="padding:10px;"
                            th:text="${e.usuario != null} ? ${e.usuario.username} : '-'"></td>

                        <td style="padding:10px;"
                            th:text="${e.nota} ?: '-'"></td>

                        <td style="padding:10px;">
                            <span th:if="${e.anulada == true}"
                                  class="etiqueta etiqueta-anulada"
                                  th:title="'Anulada el ' + ${#temporals.format(e.fechaAnulacion, 'dd/MM/yyyy HH:mm')}">Anulada</span>
                            <span th:unless="${e.anulada == true}"
                                  class="etiqueta etiqueta-ok">Activa</span>
                        </td>

                        <td style="padding:10px;" th:if="${esAdmin}">

                            <form th:if="${e.anulada != true}"
                                  method="post"
                                  th:action="@{/entradas/anular/{id}(id=${e.id})}"
                                  class="form-icono"
                                  data-titulo="¿Anular esta entrada?"
                                  th:data-confirmar="'Se restarán ' + ${e.cantidad} + ' unidades de «' + (${e.producto != null} ? ${e.producto.nombre} : 'producto') + '» del inventario (' + ${e.numero} + ').'"
                                  data-boton="Anular"
                                  data-icono="ti-arrow-back-up"
                                  data-tipo="peligro">

                                <button type="submit"
                                        class="btn-icono ic-anular"
                                        title="Anular entrada">
                                    <i class="ti ti-arrow-back-up" aria-hidden="true"></i>
                                </button>

                            </form>

                        </td>

                    </tr>

                    </tbody>

                </table>

                <div th:replace="~{fragments/paginacion :: nav(${resultado})}"></div>

            </div>

        </div>

    </div>

</div>

<script src="/js/confirmar.js"></script>
<script src="/js/alertas.js"></script>
<script src="/js/lista-viva.js"></script>

<script>
    ListaViva.iniciar({
        formulario: '#form-filtros',
        zona: '#resultados-entradas',
        url: '/entradas'
    });
</script>

</body>
</html>
