<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Por agotarse - Eternal Sunshine</title>

    <link rel="stylesheet" href="/css/dashboard.css">

    <style>
        .resumen { color:#4a1020; margin:0 0 16px; }
        .agotado-tag { color:#900; font-weight:bold; }
        .ok-msg { text-align:center; color:#060; padding:20px; }
    </style>
</head>
<body>

<div class="dashboard">

    <div class="sidebar">

        <div class="logo-container">
            <img src="/images/logo.png" class="logo">
            <h2>Eternal Sunshine</h2>
        </div>

        <div th:replace="~{fragments/menu :: menu}"></div>

    </div>

    <div class="content">

        <div class="header">
            <h1>Por agotarse</h1>
        </div>

        <div class="tabla">

            <div style="margin-bottom:20px;">
                <a href="/" class="action-btn btn-export">
                    <i class="ti ti-arrow-left" aria-hidden="true"></i>
                    Volver al Dashboard
                </a>
            </div>

            <p class="resumen">
                <strong th:text="${sinStock}"></strong> agotados ·
                <strong th:text="${stockBajoLista}"></strong> con stock bajo (5 unidades o menos)
            </p>

            <p th:if="${#lists.isEmpty(productos)}" class="ok-msg">
                Todo el inventario tiene stock suficiente.
            </p>

            <table th:unless="${#lists.isEmpty(productos)}" style="width:100%; border-collapse: collapse;">

                <thead>

                <tr style="background:#df6794; color:white;">

                    <th style="padding:10px;">Código</th>

                    <th style="padding:10px;">Nombre</th>

                    <th style="padding:10px;">Categoría</th>

                    <th style="padding:10px;">Cantidad</th>

                    <th style="padding:10px;">Acciones</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="p : ${productos}">

                    <td style="padding:10px;" th:text="${p.codigo}"></td>

                    <td style="padding:10px;" th:text="${p.nombre}"></td>

                    <td style="padding:10px;" th:text="${p.categoria}"></td>

                    <td style="padding:10px;">
                        <span th:if="${p.cantidad == 0}" class="agotado-tag">Agotado</span>
                        <span th:unless="${p.cantidad == 0}" th:text="${p.cantidad}"></span>
                    </td>

                    <td style="padding:10px; white-space:nowrap;">

                        <a th:href="@{/entradas/nueva(producto=${p.id})}"
                           class="enlace-icono ic-editar"
                           title="Recibir mercancía de este producto">
                            <i class="ti ti-package-import" aria-hidden="true"></i>
                        </a>

                        &nbsp;&nbsp;

                        <a th:href="@{/productos/editar/{id}(id=${p.id})}"
                           class="enlace-icono ic-editar"
                           title="Editar producto">
                            <i class="ti ti-pencil" aria-hidden="true"></i>
                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
