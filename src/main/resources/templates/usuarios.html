<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios - Eternal Sunshine</title>

    <link rel="stylesheet"
          href="/css/dashboard.css">
</head>
<body>

<div class="dashboard">

    <div class="sidebar">

        <div class="logo-container">

            <img src="/images/logo.png"
                 class="logo">

            <h2>Eternal Sunshine</h2>

        </div>

        <div class="menu">

            <a href="/">Dashboard</a>

            <a href="/productos">Productos</a>

            <a href="/usuarios">Usuarios</a>

            <a href="/historial">Historial</a>

            <a href="/login">Cerrar Sesión</a>

        </div>

    </div>

    <div class="content">

        <div class="header">

            <h1>Gestión de Usuarios</h1>

        </div>

        <div class="tabla">

            <h3>Usuarios Registrados</h3>

            <div style="margin-bottom:20px;">

    <a href="/usuarios/nuevo"
       class="action-btn btn-add">

        ➕ Agregar Usuario

    </a>

</div>

            <table style="width:100%; border-collapse: collapse;">

                <thead>

                <tr style="background:#df6794; color:white;">

                    <th style="padding:10px;">ID</th>

                    <th style="padding:10px;">Usuario</th>

                    <th style="padding:10px;">Rol</th>

                    <th style="padding:10px;">Tienda</th>

                    <th style="padding:10px;">Acciones</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="usuario : ${usuarios}">

                    <td style="padding:10px;"
                        th:text="${usuario.id}">
                    </td>

                    <td style="padding:10px;"
                        th:text="${usuario.username}">
                    </td>

                    <td style="padding:10px;"
                        th:text="${usuario.rol}">
                    </td>

                    <td style="padding:10px;"
                        th:text="${usuario.tienda}">
                    </td>

                    <td style="padding:10px;">

    <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}">
        ✏️
    </a>

    &nbsp;&nbsp;

    <a th:href="@{/usuarios/eliminar/{id}(id=${usuario.id})}"
       onclick="return confirm('¿Eliminar usuario?')">
        🗑️
    </a>

</td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
