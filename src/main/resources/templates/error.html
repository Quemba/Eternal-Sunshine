<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error - Eternal Sunshine</title>

    <link rel="icon" type="image/png" href="/images/logo.png">

    <link rel="stylesheet"
          href="/css/ui.css">

    <link rel="stylesheet"
          href="/css/login.css">
</head>
<body>

<div class="login-container">

    <img src="/images/logo-completo.png"
         alt="Logo"
         class="logo">

    <div class="titulo">
        Eternal Sunshine
    </div>

    <div class="subtitulo"
         th:text="${status == 404} ? 'Este recuerdo no se encuentra' : 'Algo se nos olvidó'">
        Algo se nos olvidó
    </div>

    <p style="text-align:center; margin:20px 0;"
       th:text="${status == 404} ? 'Quizás ya fue borrado.' : 'Ocurrió un error inesperado al procesar tu solicitud. Inténtalo de nuevo o vuelve al inicio.'">
        Ocurrió un error inesperado al procesar tu solicitud. Inténtalo de nuevo o vuelve al inicio.
    </p>

    <a href="/"
       class="btn-login"
       title="Volver al inicio"
       style="display:block; text-align:center; text-decoration:none;">
        Nos vemos en Montauk
    </a>

</div>

</body>
</html>
