<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Eternal Sunshine</title>

    <link rel="stylesheet"
          href="/css/login.css">
</head>
<body>

<div class="login-container">

    <img src="/images/logo.png"
         alt="Logo"
         class="logo">

    <div class="titulo">
        Eternal Sunshine
    </div>

    <div class="subtitulo">
        Sistema de Gestión de Inventario
    </div>

    <form action="/login"
          method="post">

        <div class="form-group">

            <label>Usuario</label>

            <input type="text"
                   name="username"
                   required>

        </div>

        <div class="form-group">

            <label>Contraseña</label>

            <input type="password"
                   name="password"
                   required>

        </div>

        <button type="submit"
                class="btn-login">

            Ingresar

        </button>

    </form>

    <p class="error"
       th:if="${error}"
       th:text="${error}">
    </p>

</div>

</body>
</html>
